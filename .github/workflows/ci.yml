name: CI tests

on: [push, pull_request]

jobs:
  linux:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        versions:
          - ghc: '9.6'
            cabal: 'latest'
            cabalopts: '--ghc-option=-Werror'
          - ghc: '9.8'
            cabal: 'latest'
            cabalopts: '--ghc-option=-Werror'
          - ghc: '9.10'
            cabal: 'latest'
            cabalopts: '--ghc-option=-Werror'
          - ghc: '9.12'
            cabal: 'latest'
            cabalopts: '--ghc-option=-Werror'
          - ghc: '9.14'
            cabal: 'latest'
            cabalopts: '--ghc-option=-Werror'

    steps:
    - uses: actions/checkout@v7
    - name: Install cabal/ghc
      run: |
        ghcup install ghc --set ${{ matrix.versions.ghc }}
        ghcup install cabal --set ${{ matrix.versions.cabal }}

    - name: Update cabal and get store path
      id:   cabal-store
      shell: bash
      run: |
          cabal update -z
          echo "dir=$(cabal path -z --store-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache cabal global package db
      id:   cabal-global
      uses: actions/cache@v6
      with:
        path: |
          ${{ steps.cabal-store.outputs.dir }}
        key: ${{ runner.os }}-ghc-${{ matrix.versions.ghc }}-cabal-${{ secrets.CACHE_VERSION }}-${{ hashFiles('cabal.project', '**/*.cabal') }}
        restore-keys: |
          ${{ runner.os }}-ghc-${{ matrix.versions.ghc }}-cabal-${{ secrets.CACHE_VERSION }}-

    - name: Build
      run: |
          cabal build --enable-tests --disable-optimization -fexecutable ${{ matrix.versions.cabalopts }}

    - name: Test
      run: |
          cabal test --disable-optimization ${{ matrix.versions.cabalopts }}

